<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/output.css" />
    <title>Calendar</title>
  </head>
  <body>
    <div
      class="w-full h-[100vh] flex items-center justify-center bg-[linear-gradient(45deg,#1d0000,#20205b)]"
    >
      <div
        class="w-[300px] h-[250px] bg-white flex items-center rounded-[10px]"
      >
        <div
          class="w-[58%] h-full flex flex-col items-center justify-center text-2xl"
        >
          <p id="date">01</p>
          <p id="day">Sunday</p>
        </div>
        <div
          class="w-[42%] h-full flex flex-col items-center justify-center text-2xl bg-[#f4351e] text-white rounded-tr-[10px] rounded-br-[10px]"
        >
          <p id="month">January</p>
          <p id="year">2020</p>
        </div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
